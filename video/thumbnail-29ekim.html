<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Saha haritası · 29 Ekim kapağı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 1080×1350 (4:5) LinkedIn videosu. Her kare render(t) ile çizilir; CSS animasyonu yok. Tesis adları gösterilmez.
   Sahneler: giriş → başlık → yolculuk (takvim) → tam harita → bölge turu → il sıralaması → kapanış */
:root{--night:#0A1820;--night-2:#112631;--night-3:#16303D;--line:#23404F;--ink:#EAF2F5;--muted:#8FA9B6;--glow:#F08A48;--glow-2:#4CC3E6;
 --display:"Archivo",ui-sans-serif,system-ui,sans-serif;--body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body)}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.22;
 mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000 10%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000 10%,transparent 75%)}
.halo{position:absolute;inset:0;background:radial-gradient(ellipse 60% 30% at 50% 45%,color-mix(in srgb,var(--glow-2) 15%,transparent),transparent 70%)}
.layer{position:absolute;inset:0}
/* Giriş */
#hook{display:flex;flex-direction:column;justify-content:center;padding:0 90px;gap:28px}
.hk{font:900 112px/.92 var(--display);font-stretch:64%;letter-spacing:-.025em;position:absolute;left:90px;right:90px;top:50%}
.hk em{font-style:normal;color:var(--glow)}
.hk i{font-style:normal;color:var(--glow-2)}
/* Başlık */
#head{position:absolute;left:72px;right:72px;top:64px;display:flex;flex-direction:column;gap:16px}
.eb{font:500 21px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--glow);display:flex;align-items:center;gap:16px}
.eb::before{content:"";width:40px;height:3px;background:currentColor}
#head h1{font:900 92px/.9 var(--display);font-stretch:64%;letter-spacing:-.025em}
#head h1 em{font-style:normal;color:var(--glow-2)}
.who{font:600 27px/1.2 var(--body);color:var(--muted)}
.who b{color:var(--ink)}
/* Harita */
#mapbox{position:absolute;left:0;top:330px;width:1080px;height:580px;overflow:hidden}
#map,#lab{position:absolute;inset:0;width:1080px;height:580px;overflow:visible}
#map .pv{fill:var(--night-2);stroke:var(--line);stroke-width:1}
#map .rip{fill:none;stroke-width:2.6}
#lab .tg{font:700 19px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--night);stroke-width:5px;letter-spacing:.04em}
#lab .card rect.bg{fill:color-mix(in srgb,var(--night) 86%,transparent);stroke:var(--line)}
#lab .card .nm{font:700 19px var(--body);fill:var(--ink);letter-spacing:.05em}
#lab .card .fc{font:600 14px var(--mono);fill:var(--muted)}
#lab .card .st{font:600 15px var(--mono)}
#lab .lead{stroke:var(--muted);stroke-width:1.2}
#lab .pin{fill:var(--ink)}
/* Alt panel */
#hud{position:absolute;left:72px;right:72px;top:930px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
#date{font:900 96px/.85 var(--display);font-stretch:64%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#chap{font:600 22px/1.3 var(--body);color:var(--muted);text-align:right;max-width:470px}
#chap b{display:block;font:600 18px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--glow)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--glow-2),var(--glow))}
.bar s{position:absolute;top:12px;font:500 14px var(--mono);text-decoration:none;color:var(--muted);transform:translateX(-50%)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:16px}
.cnt div{padding-top:20px;display:flex;flex-direction:column;gap:8px}
.cnt div+div{padding-left:22px;border-left:1px solid var(--line)}
.cnt b{font:800 70px/.85 var(--display);font-stretch:66%;font-variant-numeric:tabular-nums}
.cnt span{font:500 15px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lg{display:flex;gap:26px;font:500 17px var(--mono);color:var(--muted)}
.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:10px;vertical-align:-1px}
/* Bölge paneli */
#reg{position:absolute;left:72px;right:72px;top:960px;display:flex;flex-direction:column;gap:18px}
#regN{font:900 112px/.85 var(--display);white-space:nowrap;font-stretch:64%;letter-spacing:-.02em}
#regS{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
#regS div{padding-top:18px;display:flex;flex-direction:column;gap:6px}
#regS div+div{padding-left:22px;border-left:1px solid var(--line)}
#regS b{font:800 62px/.85 var(--display);font-stretch:66%}
#regS span{font:500 15px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* Sıralama */
#rank{padding:110px 72px 0;display:flex;flex-direction:column;gap:20px}
#rank h2{font:900 92px/.9 var(--display);font-stretch:64%;letter-spacing:-.02em}
#rank h2 em{font-style:normal;color:var(--glow)}
#rank .sub{font:500 22px var(--mono);color:var(--muted)}
.rk{display:grid;grid-template-columns:230px 1fr 96px;gap:8px 20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.rk .n{font:700 28px var(--body);letter-spacing:.03em;grid-row:1/3}
.rk .b{height:20px;border-radius:4px}
.rk .b.a{background:var(--glow-2)}.rk .b.r{background:var(--glow)}
.rk .v{font:600 19px var(--mono);color:var(--muted);white-space:nowrap}
.rk .t{grid-column:3;grid-row:1/3;text-align:right;font:800 58px/.9 var(--display);font-stretch:66%}
.rk .t small{display:block;font:500 13px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.bw{display:flex;align-items:center;gap:12px}
/* Kapanış */
#end{padding:150px 72px 0;display:flex;flex-direction:column;gap:46px}
#end h2{font:900 120px/.88 var(--display);font-stretch:62%;letter-spacing:-.025em}
#end h2 em{font-style:normal;color:var(--glow)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line)}
.kp div{padding:26px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.kp div:nth-child(even){padding-left:30px;border-left:1px solid var(--line)}
.kp b{font:800 104px/.85 var(--display);font-stretch:64%}
.kp span{font:500 19px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tagl{font:600 34px/1.3 var(--body);max-width:880px}
.tagl em{font-style:normal;color:var(--glow-2)}
.url{align-self:flex-start;font:600 26px var(--mono);background:var(--glow);color:var(--night);padding:20px 28px;border-radius:999px}
.foot{position:absolute;left:72px;right:72px;bottom:46px;display:flex;justify-content:space-between;align-items:center;font:500 20px var(--mono);color:var(--muted)}
.foot b{color:var(--ink);font-weight:500}
.foot .src{font-size:14px;opacity:.7}

#stage{background:radial-gradient(ellipse 70% 40% at 50% 47%,color-mix(in srgb,var(--glow-2) 18%,transparent),transparent 70%),var(--night)}
#th-head{position:absolute;left:72px;right:72px;top:118px;display:flex;flex-direction:column;gap:22px}
#th-head h1{font:900 104px/.88 var(--display);font-stretch:62%;letter-spacing:-.03em}
#th-head h1 em{font-style:normal;color:var(--glow-2)}
#th-head h1 .o{color:var(--glow)}
#mapbox{top:400px;height:560px;overflow:visible}
#map,#lab{height:560px}
.kpi4{position:absolute;left:72px;right:72px;top:985px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.kpi4 div{padding-top:20px;display:flex;flex-direction:column;gap:8px}
.kpi4 div+div{padding-left:22px;border-left:1px solid var(--line)}
.kpi4 b{font:800 78px/.85 var(--display);font-stretch:64%}
.kpi4 span{font:500 15px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi4 small{font:600 19px var(--mono);color:var(--ink)}
.ribbon{position:absolute;left:0;right:0;top:0;height:66px;background:#E30A17;display:flex;align-items:center;justify-content:center;gap:18px;
 font:700 24px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#fff}
.ribbon i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.85}
.stripe{position:absolute;left:0;right:0;bottom:0;height:10px;background:#E30A17}
.me{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:center;gap:24px}
.me img{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--glow);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 22%,transparent)}
.me p{font:700 32px/1.15 var(--body)}
.me p span{display:block;font:500 22px var(--mono);color:var(--muted);margin-top:6px}
.play{margin-left:auto;display:flex;align-items:center;gap:14px;font:600 22px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--night-2) 85%,transparent);border:1px solid var(--line);padding:16px 24px 16px 18px;border-radius:999px}
.play i{width:42px;height:42px;border-radius:50%;background:var(--glow);display:grid;place-items:center}
.play i::before{content:"";border-left:14px solid var(--night);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
</style></head>
<body><div id="stage">
 <div class="grid"></div>
 <div class="ribbon">29 Ekim<i></i>Cumhuriyet Bayramı kutlu olsun</div>
 <div id="th-head">
  <p class="eb">Enerji verimliliği · 2024–2026</p>
  <h1><span class="o">2 yıl</span>, 33 il,<br><em>tek bir harita.</em></h1>
 </div>
 <div id="mapbox"><svg id="map"></svg><svg id="lab" viewBox="0 0 1080 560"></svg></div>
 <div class="kpi4" id="kpi"></div>
 <div class="me"><img src="../assets/img/mohamed.jpg" alt=""><p>Mohamed Sallieu Bah<span>Enerji Etüt Uzmanı</span></p><span class="play"><i></i>80 sn harita hikâyesi</span></div>
 <div class="stripe"></div>
</div>
<script src="../data/portfoy.js"></script>
<script src="../data/turkiye.js"></script>
<script>
(function(){
const D=window.PORTFOY,T=window.TURKIYE,$=s=>document.getElementById(s),UP=s=>s.toLocaleUpperCase("tr-TR");
const W=1080,H=560,NS="http://www.w3.org/2000/svg",mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const PS={};[...D.V.map(v=>[v[1],v[2],"a"]),...D.R.map(r=>[r[1],r[2],"r"])].forEach(([f,p,k])=>{if(!p)return;const s=PS[p]=PS[p]||{a:new Set,r:new Set,t:new Set,ad:0};s[k].add(f);s.t.add(f);if(k==="a")s.ad++});
const st=p=>({a:PS[p].a.size,r:PS[p].r.size,t:PS[p].t.size});
const maxAD=Math.max(...Object.values(PS).map(s=>s.ad));
const svg=$("map");const pad=10;let w=T.w+pad*2,h=T.h+pad*2;if(w/h<W/H)w=h*W/H;else h=w*H/W;const VB=[T.w/2-w/2,T.h/2-h/2,w,h];
svg.setAttribute("viewBox",VB.join(" "));
const P={};Object.entries(T.p).forEach(([n,[d,cx,cy]])=>{const p=mk("path",{d,"vector-effect":"non-scaling-stroke"});p.setAttribute("class","pv");
 const s=PS[n];if(s&&s.ad){p.style.fill="var(--glow-2)";p.style.fillOpacity=.28+.72*Math.sqrt(s.ad/maxAD)}else if(s){p.style.fill="var(--glow)";p.style.fillOpacity=.3}
 svg.append(p);P[n]={cx,cy}});
const proj=(x,y)=>[(x-VB[0])/VB[2]*W,(y-VB[1])/VB[3]*H];
/* ziyaret edilen illerde parlayan halkalar */
Object.keys(PS).forEach(n=>{if(!PS[n].ad)return;const{cx,cy}=P[n];svg.append(mk("circle",{cx,cy,r:9,fill:"none",stroke:"var(--glow-2)","stroke-width":1.4,opacity:.55}),mk("circle",{cx,cy,r:2.6,fill:"var(--ink)"}))});
/* öne çıkan il kartları */
const ctx=document.createElement("canvas").getContext("2d"),tw=(t,f)=>{ctx.font=f;return ctx.measureText(t).width};
const pl=(n,one,many)=>`${n} ${n===1?one:many||one+"s"}`;
const TOP=["İstanbul","Kocaeli","Ankara","Kayseri","İzmir","Adana"].filter(n=>PS[n]);
const SPOT={"İstanbul":[-120,-112],"Kocaeli":[96,-108],"Ankara":[70,-92],"Kayseri":[78,-34],"İzmir":[20,92],"Adana":[60,64]};
function labels(){let lab="";
TOP.forEach(n=>{const s=st(n),[px,py]=proj(P[n].cx,P[n].cy),l1=UP(n),l2=`${s.a} etüt · ${s.r} rapor`,l3=`${s.t} tesis`;
 const cw=Math.max(tw(l1,"700 21px 'IBM Plex Sans'")+18+tw(l3,"600 15px 'IBM Plex Mono'"),tw(l2,"600 16px 'IBM Plex Mono'"))+30,ch=62;
 const [dx,dy]=SPOT[n],x=px+dx,y=py+dy,ax=dx<0?x+cw:x,ay=y+ch/2;
 lab+=`<g class="card"><line class="lead" x1="${px}" y1="${py}" x2="${ax}" y2="${ay}"/><circle class="pin" cx="${px}" cy="${py}" r="5"/>
 <rect class="bg" x="${x}" y="${y}" width="${cw}" height="${ch}" rx="11"/>
 <text class="nm" x="${x+15}" y="${y+25}" style="font-size:21px">${l1}</text><text class="fc" x="${x+cw-15}" y="${y+25}" text-anchor="end" style="font-size:15px">${l3}</text>
 <text class="st" x="${x+15}" y="${y+49}" style="font-size:16px"><tspan fill="var(--glow-2)">${s.a} etüt</tspan><tspan fill="var(--muted)"> · </tspan><tspan fill="var(--glow)">${s.r} rapor</tspan></text></g>`});
$("lab").innerHTML=lab}
const fA=new Set(D.V.map(v=>v[1])).size,fR=new Set(D.R.map(r=>r[1])).size;
$("kpi").innerHTML=[[fA,"Tesiste saha etüdü",`${D.V.length} gün`,"var(--glow-2)"],[fR,"Tesis için rapor",`${D.R.length} gün`,"var(--glow)"],[D.F.length,"Toplam tesis","",""],[Object.keys(PS).length,"İl","",""]]
 .map(([v,l,sub,c])=>`<div><b style="color:${c||"var(--ink)"}">${v}</b><span>${l}</span>${sub?`<small>${sub}</small>`:""}</div>`).join("");
window.READY=document.fonts.ready.then(()=>{labels();return new Promise(r=>{const i=document.querySelector(".me img");i.complete?r(true):i.onload=()=>r(true)})});
})();
</script></body></html>
